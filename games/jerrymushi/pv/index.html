<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>たぬき探偵ジェリー 〜失われた記憶〜 PV</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.35); }
  .overlay[hidden] { display: none; }
  .big { font-size: 22px; font-weight: 700; color: #fff; text-decoration: none; border: 0; cursor: pointer;
    padding: 18px 34px; border-radius: 999px; background: rgba(255,255,255,.16);
    box-shadow: 0 0 0 2px rgba(255,255,255,.7) inset; -webkit-tap-highlight-color: transparent; }
  .play::before { content: "▶ "; }
  .to-game { position: fixed; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom));
    font-size: 13px; color: rgba(255,255,255,.75); text-decoration: none;
    padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,.45); }
</style>
</head>
<body>
<div class="stage">
  <video id="pv" src="pv.mp4" poster="poster.jpg" playsinline preload="metadata"></video>
</div>
<div class="overlay" id="start"><button class="big play" id="playBtn">タップで再生</button></div>
<div class="overlay" id="end" hidden><a class="big" href="../">ゲームを始める</a></div>
<a class="to-game" href="../">ゲームへ</a>
<script>
  const v = document.getElementById("pv");
  const start = document.getElementById("start");
  const end = document.getElementById("end");
  document.getElementById("playBtn").addEventListener("click", () => {
    v.muted = false;
    v.controls = true;
    start.hidden = true;
    v.play();
  });
  v.addEventListener("play", () => { start.hidden = true; end.hidden = true; });
  v.addEventListener("ended", () => { end.hidden = false; });
</script>
</body>
</html>
