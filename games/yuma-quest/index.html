<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ユウマクエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root { --ui: 'DotGothic16', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: var(--ui); color: #fff; user-select: none; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #loading { background: #000; z-index: 30; }
  #loading .bar { width: min(70vw, 420px); height: 14px; border: 3px solid #fff; margin-top: 18px; }
  #loading .bar i { display: block; height: 100%; width: 0; background: #fff; }
  #title { z-index: 20; background: linear-gradient(#000 0%, #020418 55%, #0a1240 100%); cursor: pointer; display: none; overflow: hidden; }
  #stars { position: absolute; inset: 0; width: 100%; height: 100%; }
  #title .logo { position: relative; font-family: 'Hiragino Mincho ProN', 'Noto Serif JP', 'Yu Mincho', serif; font-weight: 900; font-size: clamp(46px, 12.5vw, 150px); line-height: 1.05; letter-spacing: .04em; margin: 0; white-space: nowrap;
    background: linear-gradient(#e8f4ff 0%, #8fc0ff 38%, #2a5cd8 52%, #1b2f9a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: clamp(3px, .7vw, 9px) #f2c640; paint-order: stroke fill; filter: drop-shadow(0 6px 0 #5a3a00) drop-shadow(0 0 18px rgba(120,160,255,.6)); }
  #title .num { position: relative; font-family: 'Hiragino Mincho ProN', 'Noto Serif JP', serif; font-weight: 900; font-size: clamp(24px, 5.5vw, 60px); color: #f2c640; letter-spacing: .3em; text-shadow: 0 3px 0 #5a3a00; margin-top: 4px; }
  #title .sub { position: relative; font-size: clamp(13px, 2.2vw, 20px); color: #cfe0ff; margin: 6px 0 clamp(22px, 5vh, 46px); letter-spacing: .2em; }
  #title .menu { position: relative; padding: 14px 40px 14px 24px; font-size: clamp(16px, 2.8vw, 26px); line-height: 2; text-align: left; }
  #title .menu .cur { display: inline-block; width: 1.2em; animation: blink 1s steps(2) infinite; }
  #title .menu .dim { opacity: .45; }
  #title .copy { position: absolute; bottom: 10px; left: 0; right: 0; font-size: clamp(10px, 1.6vw, 14px); opacity: .8; letter-spacing: .1em; }
  #title .how { position: absolute; bottom: 30px; left: 0; right: 0; font-size: clamp(10px, 1.6vw, 14px); opacity: .7; }
  #title .castle { position: absolute; left: 0; right: 0; bottom: 0; height: 26%; width: 100%; }
  @keyframes blink { 50% { opacity: 0; } }
  .win { background: rgba(0, 0, 60, .88); border: 4px solid #fff; border-radius: 10px; box-shadow: 0 0 0 3px #000, 0 6px 20px rgba(0,0,0,.5); }
  #dialog { position: fixed; left: 50%; bottom: 4vh; transform: translateX(-50%); width: min(92vw, 820px); min-height: 150px; padding: 18px 24px 22px; z-index: 10; display: none; font-size: clamp(16px, 2.6vw, 24px); line-height: 1.7; cursor: pointer; }
  #dialog .who { position: absolute; top: -18px; left: 20px; padding: 2px 14px; font-size: .75em; background: rgba(0,0,60,.95); border: 3px solid #fff; border-radius: 6px; }
  #dialog .next { position: absolute; right: 18px; bottom: 8px; font-size: .8em; animation: blink .8s steps(2) infinite; visibility: hidden; }
  #hud { position: fixed; top: 12px; left: 12px; padding: 8px 14px; z-index: 5; font-size: clamp(12px, 2vw, 17px); display: none; }
  #lv { position: fixed; top: 12px; right: 12px; padding: 8px 14px; z-index: 5; font-size: clamp(12px, 2vw, 18px); display: none; color: #ffe27a; }
  #sub { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); z-index: 6; padding: 8px 18px; font-size: clamp(14px, 2.4vw, 22px); display: none; white-space: nowrap; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 15; transition: opacity 1.4s; }
  #end { z-index: 25; display: none; background: rgba(0,0,30,.0); transition: background 2s; pointer-events: none; }
  #end.show { background: rgba(0,0,30,.45); pointer-events: auto; }
  #end .line { font-size: clamp(16px, 3vw, 28px); line-height: 2; opacity: 0; transition: opacity 1.2s; text-shadow: 0 2px 6px #000; }
  #end .line.on { opacity: 1; }
  #end .fin { font-size: clamp(44px, 12vw, 110px); letter-spacing: .15em; margin: 14px 0 4px; text-shadow: 0 4px 0 #8a3a1b, 0 0 30px #ffd37a; opacity: 0; transition: opacity 1.5s; }
  #end .fin.on { opacity: 1; }
  #end button { margin-top: 18px; font-family: var(--ui); font-size: clamp(16px, 2.6vw, 22px); color: #fff; padding: 10px 28px; cursor: pointer; opacity: 0; transition: opacity 1s; }
  #end button.on { opacity: 1; }
  #stick { position: fixed; left: 24px; bottom: 28px; width: 130px; height: 130px; border-radius: 50%; border: 3px solid rgba(255,255,255,.55); background: rgba(255,255,255,.12); z-index: 8; display: none; }
  #stick i { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(255,255,255,.55); }
  body.touch.playing #stick { display: block; }
</style>
</head>
<body>
<div id="loading" class="overlay">
  <div style="font-size:22px">ユウマクエスト　よみこみちゅう…</div>
  <div class="bar"><i id="bar"></i></div>
  <div id="loadmsg" style="margin-top:14px;font-size:13px;opacity:.7"></div>
</div>
<div id="title" class="overlay">
  <canvas id="stars"></canvas>
  <svg class="castle" viewBox="0 0 1200 220" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <path d="M0 220 V150 Q150 110 300 150 T600 140 T900 150 T1200 130 V220Z" fill="#050a22"/>
    <g fill="#02040f">
      <path d="M0 220 V175 Q200 140 380 178 T760 170 T1200 160 V220Z"/>
      <rect x="520" y="120" width="160" height="60"/><rect x="545" y="92" width="110" height="30"/><rect x="565" y="68" width="70" height="26"/>
      <path d="M505 120 L600 100 L695 120Z"/><path d="M535 92 L600 74 L665 92Z"/><path d="M555 68 L600 48 L645 68Z"/>
      <rect x="470" y="130" width="40" height="55"/><path d="M462 130 L490 112 L518 130Z"/>
      <rect x="690" y="130" width="40" height="55"/><path d="M682 130 L710 112 L738 130Z"/>
    </g>
  </svg>
  <div class="logo">ユウマクエスト</div>
  <div class="num">― I ―</div>
  <div class="sub">いぬの ゆうしゃと わすれもの</div>
  <div class="menu win"><span class="cur">▶</span>ぼうけんを はじめる<br><span class="cur"></span><span class="dim">つづきから（じゅんびちゅう）</span></div>
  <div class="how">うごかす：WASD / ↑↓←→　カメラ：Q E / ドラッグ　はなす・つぎへ：スペース / クリック　♪ おとが でます</div>
  <div class="copy">© 2026 ATCHI-YUMA PROJECT　― PUSH SPACE / TAP ―</div>
</div>
<div id="hud" class="win"></div>
<div id="lv" class="win"></div>
<div id="sub" class="win"></div>
<div id="dialog" class="win"><div class="who"></div><div class="text"></div><div class="next">▼</div></div>
<div id="fade"></div>
<div id="end" class="overlay">
  <div class="line" id="e1">ユウマは 王様の たのみを すっかり わすれて、</div>
  <div class="line" id="e2">オヤツを おなかいっぱい たべましたとさ。</div>
  <div class="fin" id="efin">おしまい</div>
  <div class="line" id="e3" style="font-size:clamp(12px,2vw,18px)"></div>
  <button id="again" class="win">もういちど あそぶ</button>
</div>
<div id="stick"><i></i></div>
<canvas id="c"></canvas>

<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js", "three/addons/": "./lib/addons/" } }
</script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
